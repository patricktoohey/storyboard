<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard</title>
<style>
:root {
  --bg: #121214; --panel: #1b1b1f; --panel-2: #24242a; --line: #33333b;
  --text: #ececf1; --muted: #9a9aa6; --accent: #f2b544; --ok: #5fc48a; --bad: #ef6a5b;
  --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, textarea, input { font: inherit; color: inherit; }
button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: var(--accent); color: #1a1406; border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .5; cursor: progress; }
select, textarea, input { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
textarea { width: 100%; resize: vertical; }
a { color: var(--accent); }
header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: .04em; }
header h1 span { color: var(--accent); }
header select { max-width: 340px; }
.spacer { flex: 1; }
main { padding: 20px; max-width: 1500px; margin: 0 auto; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.board-head { display: grid; grid-template-columns: 1fr auto; gap: 16px; margin-bottom: 18px; }
.board-head h2 { margin: 0 0 4px; font-size: 22px; }
.cast { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.cast figure { margin: 0; display: flex; gap: 8px; align-items: center; max-width: 360px; }
.cast img { width: 56px; height: 56px; object-fit: cover; border-radius: 50%; border: 2px solid var(--line); background: var(--panel-2); }
.roles { display: grid; gap: 6px; align-content: start; min-width: 260px; }
.roles label { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.roles select, .crewpick select { max-width: 300px; }
.crewpick { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 16px; }
.crewpick label { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.layout { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
.cell { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.cell.busy { border-color: var(--accent); }
.frame { position: relative; aspect-ratio: 1344 / 576; background: #000; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame .tag { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.65); padding: 2px 8px; border-radius: 99px; font-size: 12px; }
.frame .tag.right { left: auto; right: 8px; }
.frame .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
.body { padding: 12px; display: grid; gap: 10px; }
.beat { font-size: 15px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.pill { border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.pill.printed { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.takes { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.take { flex: 0 0 auto; width: 92px; border: 2px solid transparent; border-radius: 6px; padding: 0; background: none; position: relative; }
.take img, .take .ph { width: 100%; aspect-ratio: 1344/576; object-fit: cover; border-radius: 4px; display: block; background: var(--panel-2); }
.take.sel { border-color: var(--text); }
.take .n { position: absolute; left: 3px; bottom: 3px; font-size: 10px; background: rgba(0,0,0,.7); padding: 0 5px; border-radius: 4px; }
.take .dot { position: absolute; right: 4px; top: 4px; width: 8px; height: 8px; border-radius: 50%; }
.dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.stale { background: var(--muted); } .dot.wip { background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .3; } }
.prompt { font-size: 12px; color: var(--muted); max-height: 7.5em; overflow: auto; border-left: 2px solid var(--line); padding-left: 8px; }
.issues { font-size: 12px; color: var(--bad); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.notes { font-size: 12px; color: var(--muted); white-space: pre-wrap; max-height: 6em; overflow: auto; }
.status { font-size: 12px; color: var(--accent); min-height: 1.2em; }
aside.log { position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
aside.log h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
aside.log li { list-style: none; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
aside.log ul { padding: 0; margin: 0; }
aside.log code { color: var(--accent); }
aside.log b { color: var(--text); font-weight: 600; }
aside.log h3 + ul { margin-bottom: 16px; }
.job { display: grid; grid-template-columns: 10px 1fr; gap: 8px; align-items: start; }
.job .dot { position: static; margin-top: 4px; width: 8px; height: 8px; border-radius: 50%; }
.dot.queued { background: var(--line); } .dot.running { background: var(--accent); animation: pulse 1s infinite alternate; }
.dot.done { background: var(--ok); } .dot.failed { background: var(--bad); }
.newboard { display: grid; gap: 10px; max-width: 900px; }
.cut { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; margin-bottom: 18px; }
.cut video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; display: block; }
.cut ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 12px; }
.cut li.now { color: var(--accent); }
@media (max-width: 900px) { .cut { grid-template-columns: 1fr; } }
.talk { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; font-size: 12px; max-height: 18em; overflow: auto; }
.talk li { border-left: 2px solid var(--line); padding-left: 8px; }
.talk time { color: var(--muted); margin-right: 4px; }
.arena-head { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.clock { font-size: 28px; font-variant-numeric: tabular-nums; color: var(--accent); }
table.lb { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.lb th, table.lb td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.lb th { color: var(--muted); font-weight: 500; font-size: 12px; }
.bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; min-width: 90px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.strip { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.strip img, .strip .ph { width: 74px; aspect-ratio: 1344/576; object-fit: cover; border-radius: 3px; background: var(--panel-2); }
.evolution { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 12px; overflow-x: auto; }
.evolution > div { background: var(--panel-2); border-radius: 8px; padding: 10px; font-size: 12px; white-space: pre-wrap; }
.evolution b { display: block; margin-bottom: 4px; color: var(--accent); }
.replay-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 20; display: grid; place-items: center; padding: 16px; }
.replay-box { width: min(1280px, 100%); display: grid; gap: 10px; }
.replay-box canvas, .replay-box video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; margin-top: 16px; }
table.menu { width: 100%; border-collapse: collapse; font-size: 13px; }
table.menu th, table.menu td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.menu th { color: var(--muted); font-weight: 500; font-size: 12px; }
table.menu tr.off td { color: var(--muted); }
table.menu code { font-size: 12px; }
.slot { margin-top: 16px; overflow-x: auto; }
.slot h3 { margin: 0 0 2px; }
.producer textarea { width: 100%; box-sizing: border-box; }
.producer li { list-style: none; border-left: 2px solid var(--accent); padding: 4px 0 4px 10px; margin: 0 0 8px; font-size: 13px; }
.producer li .answer { color: var(--muted); margin-top: 3px; }
.teamrows { display: grid; gap: 6px; }
.teamrows .row input[type=text] { width: 120px; }
.estimate { font-size: 12px; color: var(--muted); }
.estimate.short { color: var(--bad); }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); max-width: 520px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.6); }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .board-head { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } main, header { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <h1>STORY<span>BOARD</span></h1>
  <select id="boards"><option value="">Loading boards…</option></select>
  <button id="refresh" title="Reload board">Refresh</button>
  <button id="new">New board</button>
  <button id="models">Models</button>
  <span class="spacer"></span>
  <span id="busy" class="small muted"></span>
  <button id="key" class="small">Key</button>
</header>
<main id="main"><p class="muted">Loading…</p></main>

<dialog id="keydlg">
  <form method="dialog" class="newboard">
    <h3 style="margin:0">Access key</h3>
    <p class="muted small" style="margin:0">The <code>SPIKE_KEY</code> from <code>spike/.env</code>. It's stored in this browser only.</p>
    <input id="keyin" type="password" autocomplete="off" placeholder="SPIKE_KEY">
    <div class="row"><button class="primary" value="save">Save</button></div>
  </form>
</dialog>

<script type="module">
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

let key = store.get("storyboard.key") || "";
let state = null;          // current board state from /state
let inflight = 0;          // API requests in flight
let jobs = [];             // the board's jobs ledger (jobs.csv on its `jobs` branch), newest first
let jobsSig = "";          // id:status of every job, to notice transitions
const selected = {};       // cell id -> selected take number
const busyCells = new Set();
const cellStatus = {};     // cell id -> status line
const imgCache = new Map();

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { authorization: `Bearer ${key}`, ...(opts.body ? { "content-type": "application/json" } : {}), ...(opts.headers || {}) } });
  if (res.status === 401) { askKey(); throw new Error("unauthorized"); }
  const type = res.headers.get("content-type") || "";
  const body = type.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body?.error || body || res.statusText);
  return body;
}

async function img(ref, path, cacheable = true) {
  const k = `${state?.repo}|${ref}|${path}`;
  if (cacheable && imgCache.has(k)) return imgCache.get(k);
  const res = await fetch(`/boards/${state.repo}/file?ref=${encodeURIComponent(ref)}&path=${encodeURIComponent(path)}`, { headers: { authorization: `Bearer ${key}` } });
  if (!res.ok) return null;
  const url = URL.createObjectURL(await res.blob());
  if (cacheable) imgCache.set(k, url);
  return url;
}

function askKey() { $("#keyin").value = key; $("#keydlg").showModal(); }
$("#keydlg").addEventListener("close", () => { key = $("#keyin").value.trim(); store.set("storyboard.key", key); loadBoards(); });
$("#key").onclick = askKey;
$("#refresh").onclick = () => arena ? openArena(arena.arena) : state && openBoard(state.repo);
$("#new").onclick = () => { history.replaceState(null, "", "#"); renderNew(); };
$("#models").onclick = () => { history.replaceState(null, "", "#models"); renderModels(); };
$("#boards").onchange = (e) => e.target.value ? open(e.target.value) : renderNew();

function setBusy() { $("#busy").textContent = inflight ? `${inflight} operation${inflight > 1 ? "s" : ""} running…` : ""; }

async function run(label, cellIds, fn) {
  inflight++; setBusy();
  cellIds.forEach((c) => { busyCells.add(c); cellStatus[c] = label; });
  render();
  try {
    return await fn();
  } catch (err) {
    cellIds.forEach((c) => (cellStatus[c] = `Error: ${err.message}`));
    throw err;
  } finally {
    inflight--; setBusy();
    cellIds.forEach((c) => busyCells.delete(c));
    if (state?.repo) await watch(true);
  }
}

const openJob = (j) => j.status === "queued" || j.status === "running";

/**
 * Polls the jobs ledger. Any job changing status refreshes the board (new branches, frames, prints);
 * while jobs are running the board refreshes every few polls too, so frames appear as they render.
 */
let ticks = 0;
async function watch(force = false) {
  if (!state?.repo || (document.hidden && !force)) return;
  const repo = state.repo;
  const next = await api(`/boards/${repo}/jobs`).catch(() => null);
  if (!next || state?.repo !== repo) return;
  const sig = next.map((j) => `${j.id}:${j.status}`).join(",");
  const changed = sig !== jobsSig;
  jobs = next; jobsSig = sig;
  ticks++;
  // Re-render only on change: a re-render replaces the page, which would restart a playing video
  if (force || changed || (jobs.some(openJob) && ticks % 3 === 0)) await refresh();
}
setInterval(() => watch().catch(console.error), 2500);
// A board opened in a background tab loads at once (a forced watch); coming back to it catches up
document.addEventListener("visibilitychange", () => { if (!document.hidden) watch(true).catch(console.error); });

async function loadBoards() {
  if (!key) return askKey();
  const [boards, arenas, seasons] = await Promise.all([api("/boards"), api("/arenas").catch(() => []), api("/seasons").catch(() => [])]);
  const sel = $("#boards");
  sel.innerHTML = `<option value="">— New board, arena or season —</option>`
    + (seasons.length ? `<optgroup label="Seasons">${seasons.map((x) => `<option value="${esc(x.name)}">${esc(x.name.replace("season-", ""))} · ${esc(x.description || "")}</option>`).join("")}</optgroup>` : "")
    + (arenas.length ? `<optgroup label="Arenas">${arenas.map((a) => `<option value="${esc(a.name)}">${esc(a.name.replace("arena-", ""))} · ${esc((a.description || "").replace("Arena: ", "").slice(0, 45))}</option>`).join("")}</optgroup>` : "")
    + `<optgroup label="Boards">${boards.map((b) => `<option value="${esc(b.name)}">${esc(b.name.replace("board-", ""))} · ${esc((b.description || "").slice(0, 50))}</option>`).join("")}</optgroup>`;
  const want = location.hash.slice(1) || seasons[0]?.name || arenas[0]?.name || boards[0]?.name;
  if (want) { sel.value = want; open(want); } else renderNew();
}

// What's on screen, so links to another board, arena or season (#name) open it, and a view setting its own hash doesn't reopen
let showing = "";
window.addEventListener("hashchange", () => {
  const name = decodeURIComponent(location.hash.slice(1));
  if (name && name !== showing) { $("#boards").value = name; open(name); }
});
const open = (name) => (name === "models" ? renderModels() : name.startsWith("season-") ? openSeason(name) : name.startsWith("arena-") ? openArena(name) : openBoard(name));

async function renderNew() {
  showing = "";
  state = null;
  clearInterval(arenaTimer);
  arena = null;
  $("#boards").value = "";
  const [skills, menu, boardList] = await Promise.all([api("/skills").catch(() => []), api("/menu").catch(() => null), api("/boards").catch(() => [])]);
  const opts = (role) => skills.filter((s) => s.role === role).map((s) => `<option value="${esc(s.name)}">${esc(s.style)}</option>`).join("");
  $("#main").innerHTML = `
    <div class="panel newboard">
      <h2 style="margin:0">New board</h2>
      <p class="muted" style="margin:0">A director agent plans the shots, casting renders the characters, then one agent chain per cell shoots in parallel on its own branch.</p>
      <textarea id="concept" rows="4" placeholder="A lonely lighthouse keeper finds a message in a bottle written in her own handwriting…"></textarea>
      <div class="row">
        <label class="small muted">Cells <input id="ncells" type="number" min="1" max="8" value="4" style="width:64px"></label>
        <label class="small muted">Cinematographer <select id="cine">${opts("cinematographer")}</select></label>
        <button class="primary" id="create">Create board</button>
      </div>
      ${menu ? `<details><summary class="small muted">Models: the default crew, or pick your own from the <a href="#models">menu</a></summary>
        <div class="crewpick" style="margin-top:8px">${CREW_SLOTS.map((slot) => crewSelect(menu, slot, menu.default_crew[slot], "data-newcrew")).join("")}</div></details>` : ""}
      <div class="status" id="newstatus"></div>
    </div>
    <div class="panel newboard" style="margin-top:18px">
      <h2 style="margin:0">New arena</h2>
      <p class="muted" style="margin:0">Autonomous teams answer one brief with a budget and a deadline. Each team's showrunner agent plans, gives notes, prints, cuts video and submits; Clef judges score the boards live. Video is required. A team can carry on from an earlier board, with every branch, and must submit a new cut.</p>
      <textarea id="brief" rows="3" placeholder="A 30-second story about something lost and found."></textarea>
      <div class="teamrows" id="teamrows"></div>
      <div class="row"><button id="addteam" class="small">Add a team</button></div>
      <div class="row">
        <label class="small muted">Minutes <input id="aminutes" type="number" min="5" max="120" value="20" style="width:64px"></label>
        <label class="small muted">Budget per team $<input id="abudget" type="number" min="1" max="50" value="5" style="width:64px"></label>
        <label class="small muted">Cells <input id="acells" type="number" min="2" max="8" value="4" style="width:64px"></label>
        <label class="small muted"><input id="aignore" type="checkbox"> start even if credits look short</label>
        <button class="primary" id="createArena">Start arena</button>
      </div>
      <div class="estimate" id="aestimate"></div>
      <div class="status" id="arenastatus"></div>
    </div>
    <div class="panel newboard" style="margin-top:18px">
      <h2 style="margin:0">New season</h2>
      <p class="muted" style="margin:0">The same three teams over several arena rounds. After each round every showrunner reads the judges' comparisons and its rivals' play, writes lessons and rewrites its own strategy (in its team repo) before the next round. One brief per line; rounds cycle through them.</p>
      <textarea id="sbriefs" rows="3" placeholder="A 30-second story about something lost and found.&#10;A 30-second story about a small act of kindness between strangers."></textarea>
      <div class="row">
        <label class="small muted">Rounds <input id="srounds" type="number" min="2" max="6" value="2" style="width:56px"></label>
        <label class="small muted">Minutes per round <input id="sminutes" type="number" min="5" max="120" value="15" style="width:56px"></label>
        <label class="small muted">Budget $<input id="sbudget" type="number" min="1" max="50" value="5" style="width:56px"></label>
        <label class="small muted">Cells <input id="scells" type="number" min="2" max="8" value="3" style="width:56px"></label>
        <button class="primary" id="createSeason">Start season</button>
      </div>
      <div class="status" id="seasonstatus"></div>
    </div>`;
  $("#createSeason").onclick = async () => {
    const briefs = $("#sbriefs").value.split("\n").map((x) => x.trim()).filter(Boolean);
    if (!briefs.length) return;
    $("#createSeason").disabled = true;
    $("#seasonstatus").textContent = "Creating the season, a repo per team, and round 1…";
    try {
      const out = await api("/seasons", { method: "POST", body: JSON.stringify({ briefs, rounds: Number($("#srounds").value), minutes: Number($("#sminutes").value), budget: Number($("#sbudget").value), cells: Number($("#scells").value) }) });
      location.hash = out.season;
      await loadBoards();
    } catch (err) { $("#seasonstatus").textContent = `Error: ${err.message}`; $("#createSeason").disabled = false; }
  };
  // Teams: a showrunner skill, an optional pinned lead, and optionally a board to carry on from (D40)
  const showrunners = skills.filter((s) => s.role === "showrunner");
  const leads = (menu?.slots.lead ?? []).filter((o) => !o.unavailable);
  const fromBoards = boardList.filter((b) => b.name.startsWith("board-"));
  const teamRow = (t = {}) => `<div class="row" data-team>
      <input type="text" data-k="team" value="${esc(t.team ?? "")}" placeholder="team name">
      <select data-k="showrunner">${showrunners.map((s) => `<option value="${esc(s.name)}" ${s.name === `showrunner-${t.team}` ? "selected" : ""}>${esc(s.style)}</option>`).join("")}</select>
      <select data-k="lead"><option value="">lead: drafted</option>${leads.map((o) => `<option value="${esc(o.key)}">lead: ${esc(o.key)}</option>`).join("")}</select>
      <select data-k="from" style="max-width:260px"><option value="">fresh board</option>${fromBoards.map((b) => `<option value="${esc(b.name)}">carry on from ${esc(b.name.replace("board-", ""))}</option>`).join("")}</select>
      <button class="small" data-remove title="Remove this team">✕</button></div>`;
  const rows = $("#teamrows");
  const wire = () => {
    rows.querySelectorAll("[data-remove]").forEach((b) => (b.onclick = () => { b.closest("[data-team]").remove(); estimate(); }));
    rows.querySelectorAll("[data-k=from]").forEach((sel) => (sel.onchange = () => { sel.closest("[data-team]").querySelector("[data-k=showrunner]").disabled = Boolean(sel.value); }));
  };
  rows.innerHTML = (menu?.default_teams ?? ["auteur", "documentarian", "safe"]).map((team) => teamRow({ team })).join("");
  wire();
  $("#addteam").onclick = () => { rows.insertAdjacentHTML("beforeend", teamRow()); wire(); estimate(); };
  const teamsOf = () => [...rows.querySelectorAll("[data-team]")].map((r) => {
    const v = (k) => r.querySelector(`[data-k=${k}]`).value.trim();
    return { team: v("team"), ...(v("from") ? { from: v("from") } : { showrunner: v("showrunner") }), ...(v("lead") ? { lead: v("lead") } : {}) };
  }).filter((t) => t.team);
  // What it can cost, by the estimate the server checks against the balance
  const estimate = async () => {
    const out = await api(`/credits?rounds=1&teams=${teamsOf().length}&budget=${Number($("#abudget").value)}`).catch(() => null);
    const el = $("#aestimate");
    if (!out || out.estimate == null) return (el.textContent = "");
    const short = typeof out.balance === "number" && out.balance < out.estimate;
    el.className = `estimate${short ? " short" : ""}`;
    el.textContent = `Can cost about $${out.estimate.toFixed(2)}${typeof out.balance === "number" ? ` · $${out.balance.toFixed(2)} in AI Gateway credits${short ? ": too little, top up first" : ""}` : ""}`;
  };
  $("#abudget").oninput = estimate;
  estimate();
  $("#createArena").onclick = async () => {
    const brief = $("#brief").value.trim();
    if (!brief) return;
    const teams = teamsOf();
    if (!teams.length) return ($("#arenastatus").textContent = "Add at least one team");
    $("#createArena").disabled = true;
    $("#arenastatus").textContent = "Creating the arena and forking a board per team…";
    try {
      const out = await api("/arenas", { method: "POST", body: JSON.stringify({ brief, teams, minutes: Number($("#aminutes").value), budget: Number($("#abudget").value), cells: Number($("#acells").value), ignore_credits: $("#aignore").checked }) });
      location.hash = out.arena;
      await loadBoards();
    } catch (err) { $("#arenastatus").textContent = `Error: ${err.message}`; $("#createArena").disabled = false; }
  };
  $("#create").onclick = async () => {
    const concept = $("#concept").value.trim();
    if (!concept) return;
    $("#create").disabled = true;
    $("#newstatus").textContent = "Forking the template…";
    try {
      // Only the slots changed from the default crew; none means the board keeps the default
      const crew = Object.fromEntries([...document.querySelectorAll("select[data-newcrew]")].filter((el) => el.value !== menu.default_crew[el.dataset.newcrew]).map((el) => [el.dataset.newcrew, el.value]));
      const out = await api("/boards", { method: "POST", body: JSON.stringify({ concept, cells: Number($("#ncells").value), skills: { cinematographer: $("#cine").value }, ...(Object.keys(crew).length ? { crew } : {}) }) });
      // The board exists now; directing, casting and shooting run as jobs you can watch
      location.hash = out.repo;
      await loadBoards();
    } catch (err) { $("#newstatus").textContent = `Error: ${err.message}`; $("#create").disabled = false; }
  };
}

// ── Arena view ──────────────────────────────────────────────────────────────────────────────
let arena = null;
let arenaTimer = null;

async function frameOf(repo, ref, path) {
  const k = `${repo}|${ref}|${path}`;
  if (imgCache.has(k)) return imgCache.get(k);
  const res = await fetch(`/boards/${repo}/file?ref=${encodeURIComponent(ref)}&path=${encodeURIComponent(path)}`, { headers: { authorization: `Bearer ${key}` } });
  if (!res.ok) return null;
  const url = URL.createObjectURL(await res.blob());
  imgCache.set(k, url);
  return url;
}

async function openArena(name) {
  showing = name;
  location.hash = name;
  state = null;
  clearInterval(arenaTimer);
  $("#main").innerHTML = `<p class="muted">Loading ${esc(name)}…</p>`;
  // Polls only while visible, but always loads once, even in a background tab
  const tick = async (first = false) => {
    if (!location.hash.includes(name) || (document.hidden && !first)) return;
    arena = await api(`/arenas/${name}/state`).catch(() => arena);
    renderArena();
  };
  await tick(true);
  arenaTimer = setInterval(tick, 4000);
}

// Talk lines as committed ("- 14:05 **Ada** → **Ren**: text"), newest last
function talkHtml(lines, empty = "nothing said yet") {
  if (!lines?.length) return `<p class="small muted">${empty}</p>`;
  return `<ul class="talk">${lines.map((l) => {
    const m = /^- (\d\d:\d\d) (.*)$/.exec(l);
    const body = esc(m ? m[2] : l.replace(/^- /, "")).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    return `<li>${m ? `<time>${m[1]}</time>` : ""}${body}</li>`;
  }).join("")}</ul>`;
}

// ── Replay: the arena rebuilt from Git history, drawn on a canvas, optionally recorded ─────────────
async function openReplay(name) {
  clearInterval(arenaTimer);
  const tl = await api(`/arenas/${name}/timeline`);
  const overlay = document.createElement("div");
  overlay.className = "replay-overlay";
  overlay.innerHTML = `<div class="replay-box">
    <canvas id="rc" width="1280" height="720"></canvas>
    <div class="row"><button class="primary" id="rplay">Play</button><button id="rrec">Record and save to the arena</button>
      ${tl.replays.map((b) => `<button data-replay="${esc(b)}">Watch ${esc(b)}</button>`).join("")}
      <span class="spacer"></span><span class="small muted" id="rstatus">${tl.events.length} events from ${tl.rules.teams.length} boards and the arena</span><button id="rclose">Close</button></div></div>`;
  document.body.appendChild(overlay);
  const status = (t) => ($("#rstatus").textContent = t);
  $("#rclose").onclick = () => { overlay.remove(); openArena(name); };
  overlay.querySelectorAll("[data-replay]").forEach((b) => (b.onclick = async () => {
    const url = await frameOf(name, b.dataset.replay, "replay.webm") || await frameOf(name, b.dataset.replay, "replay.mp4");
    const v = document.createElement("video"); v.src = url; v.controls = true; v.autoplay = true;
    $("#rc").replaceWith(v); v.id = "rc";
  }));
  status("Loading frames…");
  const player = await buildReplay(tl, $("#rc"));
  status(`${tl.events.length} events · ~${Math.round(player.duration)}s`);
  $("#rplay").onclick = () => player.play();
  $("#rrec").onclick = async () => {
    const type = ["video/mp4;codecs=avc1", "video/webm;codecs=vp9", "video/webm"].find((t) => MediaRecorder.isTypeSupported(t));
    const rec = new MediaRecorder($("#rc").captureStream(30), { mimeType: type, videoBitsPerSecond: 1_500_000 });
    const chunks = [];
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    const done = new Promise((r) => (rec.onstop = r));
    rec.start(1000);
    status("Recording…");
    await player.play();
    rec.stop(); await done;
    const blob = new Blob(chunks, { type: type.split(";")[0] });
    status(`Uploading ${(blob.size / 1e6).toFixed(1)} MB…`);
    const res = await fetch(`/arenas/${name}/replay`, { method: "POST", headers: { authorization: `Bearer ${key}`, "content-type": blob.type }, body: blob });
    const out = await res.json();
    status(res.ok ? `Saved to ${out.branch}/${out.file} in ${name}` : `Upload failed: ${out.error}`);
  };
}

/** Loads every frame the timeline needs, then returns a player that draws it at a compressed pace. */
async function buildReplay(tl, canvas) {
  const ctx = canvas.getContext("2d");
  const W = 1280, H = 720;
  const teams = tl.rules.teams.map((t) => t.team);
  const boardOf = Object.fromEntries(tl.rules.teams.map((t) => [t.team, t.board]));
  // A pinned lead model is the team's identity; otherwise its showrunner style and cinematographer
  const styleOf = Object.fromEntries(tl.rules.teams.map((t) => [t.team, t.lead ? `led by ${t.lead}` : `${t.showrunner.replace("showrunner-", "")} · ${t.cinematographer}`]));
  const load = (url) => new Promise((r) => { if (!url) return r(null); const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = url; });
  const images = {};
  for (const e of tl.events.filter((x) => x.frames)) {
    for (const f of e.frames) {
      const k = `${e.team}|${f.ref}|${f.cell}`;
      images[k] = await load(await frameOf(boardOf[e.team], f.ref, `cells/${f.cell}/frame.webp`));
    }
  }
  // The winner's film for the finale: its submitted cut's clips, in EDL order
  const finals = tl.events.filter((e) => e.kind === "final");
  const submitted = new Set(tl.events.filter((e) => e.kind === "submit" && /\(cut /.test(e.text)).map((e) => e.team));
  const total = (sc) => Object.values(sc || {}).reduce((a, b) => a + b, 0) / Math.max(1, Object.keys(sc || {}).length);
  const ranked = finals.filter((f) => submitted.has(f.team)).sort((a, b) => total(b.scores) - total(a.scores));
  const winner = ranked[0]?.team;
  let clips = [];
  // A mixed film plays whole; separate clips get 5 s each
  let teaserSeconds = 0;
  if (winner) {
    const cut = /\(cut (v\d+)\)/.exec(tl.events.find((e) => e.kind === "submit" && e.team === winner).text)[1];
    const edl = await fetch(`/boards/${boardOf[winner]}/file?ref=cut/${cut}&path=video/edl.csv`, { headers: { authorization: `Bearer ${key}` } }).then((r) => r.text());
    // A mixed cut is one file (the replay records the canvas, so its sound isn't in the recording)
    const mixed = await fetch(`/boards/${boardOf[winner]}/file?ref=cut/${cut}&path=video/mix.json`, { headers: { authorization: `Bearer ${key}` } }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    teaserSeconds = mixed?.seconds ?? 0;
    const files = mixed ? ["video/teaser.mp4"] : edl.trim().split("\n").slice(1).map((l) => l.split(",")[5]);
    for (const f of files) {
      const url = await frameOf(boardOf[winner], `cut/${cut}`, f);
      const v = document.createElement("video"); v.src = url; v.muted = true; v.playsInline = true; v.preload = "auto";
      clips.push(v);
    }
  }

  // Pace: quick for takes, longer for decisions, prints and scores
  const hold = { take: 0.6, turn: 1.8, git: 2.6, print: 2.2, score: 1.6, final: 2.2, submit: 1.8, cut: 1.6, plan: 1.2, draft: 1.6, failed: 2.2, start: 2.5, close: 2.0 };
  const steps = tl.events.map((e) => ({ e, d: hold[e.kind] ?? 1 }));
  const finaleBoard = 5;
  const duration = steps.reduce((a, b) => a + b.d, 0) + finaleBoard + (teaserSeconds || clips.length * 5);
  const t0 = tl.events[0]?.t ?? 0;

  function wrap(text, x, y, width, lineH, maxLines) {
    const words = String(text).split(" "); let line = ""; let n = 0;
    for (const w of words) {
      const test = line ? `${line} ${w}` : w;
      if (ctx.measureText(test).width > width && line) { ctx.fillText(line, x, y + n * lineH); line = w; if (++n >= maxLines) return; }
      else line = test;
    }
    if (n < maxLines) ctx.fillText(line, x, y + n * lineH);
  }

  function drawState(st, upto, ticker) {
    ctx.fillStyle = "#121214"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#f2b544"; ctx.font = "600 26px system-ui"; ctx.fillText("STORYBOARD ARENA", 32, 48);
    ctx.fillStyle = "#ececf1"; ctx.font = "20px system-ui"; wrap(tl.rules.brief, 300, 46, 760, 24, 1);
    const el = Math.max(0, upto - t0);
    ctx.fillStyle = "#f2b544"; ctx.font = "600 26px ui-monospace, monospace"; ctx.textAlign = "right";
    ctx.fillText(`T+${Math.floor(el / 60)}:${String(el % 60).padStart(2, "0")}`, W - 32, 48); ctx.textAlign = "left";
    const colW = (W - 64 - (teams.length - 1) * 24) / teams.length;
    teams.forEach((team, i) => {
      const x = 32 + i * (colW + 24), y = 80, s = st[team];
      ctx.fillStyle = "#1b1b1f"; ctx.fillRect(x, y, colW, 520);
      ctx.fillStyle = "#ececf1"; ctx.font = "600 22px system-ui"; ctx.fillText(team, x + 16, y + 34);
      ctx.fillStyle = "#9a9aa6"; ctx.font = "14px system-ui"; wrap(styleOf[team], x + 16, y + 56, colW - 110, 16, 1);
      const sc = s.scores; ctx.textAlign = "right";
      ctx.fillStyle = sc ? "#ececf1" : "#9a9aa6"; ctx.font = "600 30px system-ui"; ctx.fillText(sc ? total(sc).toFixed(2) : "–", x + colW - 16, y + 40);
      ctx.font = "13px system-ui"; ctx.fillStyle = "#9a9aa6";
      ctx.fillText(sc ? Object.entries(sc).map(([k, v]) => `${k} ${v.toFixed(2)}`).join(" · ") : "not scored", x + colW - 16, y + 60); ctx.textAlign = "left";
      // 2x2 printed frames
      const fw = (colW - 48) / 2, fh = fw * 576 / 1344;
      for (let k = 0; k < 4; k++) {
        const fx = x + 16 + (k % 2) * (fw + 16), fy = y + 80 + Math.floor(k / 2) * (fh + 16);
        const f = s.frames[k]; const im = f && images[`${team}|${f.ref}|${f.cell}`];
        if (im) ctx.drawImage(im, fx, fy, fw, fh); else { ctx.fillStyle = "#24242a"; ctx.fillRect(fx, fy, fw, fh); }
        if (f) { ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(fx, fy, 70, 20); ctx.fillStyle = "#ececf1"; ctx.font = "12px system-ui"; ctx.fillText(`${f.cell} · take ${f.take}`, fx + 6, fy + 14); }
      }
      const by = y + 80 + 2 * (fh + 16) + 8;
      // Git moves (save, restore, compare, replan) flash teal: the history used as a tool
      ctx.fillStyle = s.flash > 0 ? (s.lastGit ? "#4fd1c5" : "#f2b544") : "#ececf1"; ctx.font = "15px system-ui"; wrap(s.last || "waiting for the brief", x + 16, by + 16, colW - 32, 20, 6);
      ctx.fillStyle = "#9a9aa6"; ctx.font = "13px system-ui";
      ctx.fillText(`turns ${s.turns} · takes ${s.takes} · prints ${s.prints}`, x + 16, y + 500);
      if (s.git) { ctx.fillStyle = "#4fd1c5"; ctx.fillText(`git ${s.git}`, x + 16, y + 480); }
      if (s.badge) { ctx.textAlign = "right"; ctx.fillStyle = s.badge.color; ctx.font = "600 13px system-ui"; ctx.fillText(s.badge.text, x + colW - 16, y + 500); ctx.textAlign = "left"; }
    });
    ctx.fillStyle = "#1b1b1f"; ctx.fillRect(32, 616, W - 64, 80);
    ctx.font = "14px system-ui";
    ticker.slice(-3).forEach((line, i) => { ctx.fillStyle = i === ticker.slice(-3).length - 1 ? "#ececf1" : "#9a9aa6"; ctx.fillText(line.slice(0, 150), 48, 640 + i * 22); });
  }

  async function play() {
    const st = Object.fromEntries(teams.map((t) => [t, { frames: [], scores: null, last: "", turns: 0, takes: 0, prints: 0, flash: 0, badge: null }]));
    const ticker = [];
    for (const { e, d } of steps) {
      const s = e.team && st[e.team];
      if (s) {
        if (e.kind === "print") { s.frames = e.frames; s.prints++; }
        if (e.kind === "score" || e.kind === "final") s.scores = e.scores;
        if (e.kind === "turn" || e.kind === "git") s.turns++;
        if (e.kind === "git") s.git = (s.git || 0) + 1;
        if (e.kind !== "take") s.lastGit = e.kind === "git";
        if (e.kind === "take") s.takes++;
        if (e.kind === "submit") s.badge = /\(cut /.test(e.text) ? { text: "SUBMITTED", color: "#5fc48a" } : { text: "NO VIDEO", color: "#ef6a5b" };
        if (e.kind !== "take") { s.last = e.text; s.flash = 1; }
      }
      ticker.push(`${e.team ? e.team + ": " : ""}${e.text}`);
      const until = performance.now() + d * 1000;
      while (performance.now() < until) { drawState(st, e.t, ticker); await new Promise((r) => requestAnimationFrame(r)); }
      if (s) s.flash = 0;
    }
    // Final leaderboard
    const order = ranked.map((f) => f.team).concat(teams.filter((t) => !ranked.some((f) => f.team === t)));
    let until = performance.now() + finaleBoard * 1000;
    while (performance.now() < until) {
      ctx.fillStyle = "#121214"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#f2b544"; ctx.font = "600 34px system-ui"; ctx.fillText("Final results", 80, 120);
      order.forEach((team, i) => {
        const sc = finals.find((f) => f.team === team)?.scores;
        ctx.fillStyle = "#ececf1"; ctx.font = "600 30px system-ui"; ctx.fillText(`${i + 1}. ${team}`, 80, 210 + i * 80);
        ctx.font = "22px system-ui"; ctx.fillStyle = submitted.has(team) ? "#ececf1" : "#ef6a5b";
        ctx.fillText(submitted.has(team) ? `${total(sc).toFixed(2)}  (${Object.entries(sc || {}).map(([k, v]) => `${k} ${v.toFixed(2)}`).join(", ")})` : "disqualified: no video submitted", 420, 210 + i * 80);
      });
      await new Promise((r) => requestAnimationFrame(r));
    }
    // The winner's film
    for (const [i, v] of clips.entries()) {
      v.currentTime = 0; await v.play().catch(() => {});
      until = performance.now() + (teaserSeconds || Math.min(5, v.duration || 5)) * 1000;
      while (performance.now() < until && !v.ended) {
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
        const r = (v.videoWidth / v.videoHeight) || 16 / 9, dh = W / r;
        ctx.drawImage(v, 0, (H - dh) / 2, W, dh);
        ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(24, 24, 420, 40);
        ctx.fillStyle = "#f2b544"; ctx.font = "600 20px system-ui"; ctx.fillText(teaserSeconds ? `${winner}'s film` : `${winner}'s film · shot ${i + 1}/${clips.length}`, 40, 51);
        await new Promise((r) => requestAnimationFrame(r));
      }
      v.pause();
    }
  }
  drawState(Object.fromEntries(teams.map((t) => [t, { frames: [], scores: null, last: "", turns: 0, takes: 0, prints: 0 }])), t0, [tl.rules.brief]);
  return { play, duration };
}

async function openBoard(repo) {
  clearInterval(arenaTimer);
  arena = null;
  showing = repo;
  location.hash = repo;
  $("#main").innerHTML = `<p class="muted">Loading ${esc(repo)}…</p>`;
  state = { repo };
  jobs = []; jobsSig = "";
  await watch(true);
}

async function refresh() {
  const [next] = await Promise.all([api(`/boards/${state.repo}/state`), getMenu()]);
  state = next;
  // Typing a note or an edit: a re-render would replace the box under the cursor, so the board catches up
  // when the box loses focus instead
  if (typing()) { behind = true; return; }
  render();
}
const typing = () => Boolean(document.activeElement?.matches?.("#main textarea, #main input[type=text]"));
let behind = false;
// After the click that took focus away has landed (a "Send note" button re-renders by itself)
document.addEventListener("focusout", () => setTimeout(() => { if (behind && !typing() && state?.cells) { behind = false; render(); } }, 400));

function currentTake(cell) {
  const n = selected[cell.id] ?? cell.printed ?? cell.takes.at(-1)?.take;
  // A just-queued take has no branch yet; show the printed (or latest) take until it does
  return cell.takes.find((t) => t.take === n) ?? cell.takes.find((t) => t.take === cell.printed) ?? cell.takes.at(-1);
}

const drafts = {};          // cell id -> unsent note text, kept across re-renders while polling

function jobsHtml() {
  const label = (j) => j.kind === "take" ? `cell ${j.cell} · take ${j.take}${j.attempt === "2" ? " (retake)" : ""}`
    : j.kind === "bible" ? `bible (from cell ${j.cell})` : j.kind === "video" ? `cell ${j.cell} · video` : j.kind === "assemble" ? "assemble cut" : j.kind;
  return `<h3>jobs <span class="small muted">jobs.csv</span></h3><ul>${jobs.slice(0, 25).map((j) => `
    <li class="job"><span class="dot ${esc(j.status)}"></span><span><b>${esc(label(j))}</b> <span class="muted">${esc(j.status)}</span><br>
    <span class="small muted">${esc(j.detail || "")}</span></span></li>`).join("") || `<li class="muted small">no jobs yet</li>`}</ul>`;
}

/** What a cell's running job is doing now, from the ledger. */
function cellActivity(id) {
  const j = jobs.find((x) => x.cell === id && openJob(x));
  return j && `${j.kind === "take" ? `take ${j.take}` : j.kind}: ${j.status === "queued" ? "queued" : j.detail || "running"}`;
}

function render() {
  if (!state?.cells) return;
  if (state.pending) {
    $("#main").innerHTML = `<div class="layout"><section class="panel"><h2 style="margin:0 0 6px">Directing…</h2>
      <div class="muted">${esc(state.concept.replace(/^# Concept\s*/, ""))}</div>
      <p class="small muted">The director is planning the board; casting and the cell agents follow. Their progress is on the right.</p></section>
      <aside class="log panel">${jobsHtml()}</aside></div>`;
    return;
  }
  document.querySelectorAll(".cell").forEach((card) => (drafts[card.dataset.cell] = card.querySelector("[data-note]")?.value ?? ""));
  const s = state;
  // The cut player survives re-renders while the cut is the same, so playback isn't interrupted
  const oldCut = $("#cutpanel");
  const roleSelect = (role) => `<label>${role}<select data-role="${role}">${s.skills.available.filter((k) => k.role === role).map((k) => `<option value="${esc(k.name)}" ${k.name === s.skills.chosen[role] ? "selected" : ""}>${esc(k.style)} · ${esc(k.version)}</option>`).join("")}</select></label>`;
  $("#main").innerHTML = `
    <section class="board-head panel">
      <div>
        <h2>${esc(s.title)}</h2>
        <div class="muted">${esc(s.concept)}</div>
        <div class="cast">${s.characters.map((c) => `<figure><img data-ref="main" data-path="${esc(c.portrait)}" alt=""><figcaption><b>${esc(c.name)}</b><br><span class="small muted">${esc(c.look)}</span></figcaption></figure>`).join("")}
          ${(s.locations || []).map((l) => `<figure><img data-ref="main" data-path="${esc(l.image)}" alt="" style="border-radius:6px;width:96px"><figcaption><b>${esc(l.name)}</b><br><span class="small muted">${esc(l.look)}</span></figcaption></figure>`).join("")}</div>
      </div>
      <div class="roles"><span class="small muted">Skills on this board</span>${["director", "cinematographer", "casting"].map(roleSelect).join("")}
        ${s.crew && menuCache ? `<span class="small muted" style="margin-top:6px">Models on this board · the next take, edit or cut uses them</span>${CREW_SLOTS.map((slot) => crewSelect(menuCache, slot, s.crew[slot], "data-crew")).join("")}` : ""}
        ${makeVideoButton(s)}</div>
    </section>
    ${teamHtml(s)}
    ${cutHtml(s)}
    ${soundHtml(s)}
    <div class="layout">
      <div class="grid">${s.cells.map(cellHtml).join("")}</div>
      <aside class="log panel">${jobsHtml()}<h3>main</h3><ul>${s.log.map((l) => `<li><code>${esc(l.hash)}</code> <b>${esc(l.author)}</b> ${esc(l.message)}</li>`).join("")}</ul></aside>
    </div>`;
  const pn = $("#pnote");
  if (pn) { pn.value = producerDraft; pn.oninput = () => (producerDraft = pn.value); if (producerFocus) { pn.focus(); pn.onblur = () => (producerFocus = false); } pn.onfocus = () => (producerFocus = true); }
  const send = $("#psend");
  if (send) send.onclick = async () => {
    const note = $("#pnote").value.trim();
    if (!note) return;
    send.disabled = true;
    const cell = $("#pcell").value || undefined;
    try {
      await run("Sending the producer's note…", [], () => api(`/boards/${state.repo}/producer`, { method: "POST", body: JSON.stringify({ note, cell }) }));
      producerDraft = "";
      await openBoard(state.repo);
    } catch (err) { $("#pstatus").textContent = `Error: ${err.message}`; send.disabled = false; }
  };
  const newCut = $("#cutpanel");
  if (oldCut && newCut && oldCut.dataset.key === newCut.dataset.key) newCut.replaceWith(oldCut);
  hydrate(oldCut && $("#cutpanel") === oldCut);
}

const VIDEO_PRICE_PER_S = 0.10;   // wan-2.7-i2v at 720p
const VIDEO_MAX_S = 5;            // VIDEO_MAX_SECONDS in cloudflare.config.ts

function makeVideoButton(s) {
  const printed = s.cells.filter((c) => c.printed);
  if (!printed.length) return "";
  const seconds = printed.reduce((n, c) => n + Math.max(2, Math.min(VIDEO_MAX_S, Math.round(c.duration_s) || 3)), 0);
  const running = jobs.some((j) => (j.kind === "video" || j.kind === "assemble") && openJob(j));
  return `<button class="primary" data-board-act="cut" ${running ? "disabled" : ""} title="Animates each printed frame (image-to-video), then assembles the clips">
    ${running ? "Rendering video…" : `Make video · ${printed.length} clips, ${seconds}s${!s.crew || s.crew.video === "wan-2.7-i2v" ? `, ≈$${(seconds * VIDEO_PRICE_PER_S).toFixed(2)}` : ` with ${s.crew.video}`}`}</button>`;
}

function cutHtml(s) {

/**
 * Plays a cut: its mixed teaser.mp4 when there is one (clicking a clip seeks to it), else the clips in EDL
 * order. Files are fetched with the key and played from blob URLs.
 */
async function hydrateCut() {
  const cut = state.cuts?.[0];
  const player = $("#player");
  if (!cut?.edl?.length || !player) return;
  if (cut.mix) {
    const starts = cut.edl.map((_, i) => cut.edl.slice(0, i).reduce((n, e) => n + Number(e.seconds), 0));
    const url = await img(cut.branch, "video/teaser.mp4");
    if (url && !player.src) player.src = url;
    const mark = () => {
      const i = starts.findLastIndex((t) => t <= player.currentTime + 0.01);
      document.querySelectorAll("#edl li").forEach((li) => li.classList.toggle("now", Number(li.dataset.i) === i));
    };
    player.ontimeupdate = mark;
    document.querySelectorAll("#edl li").forEach((li) => (li.onclick = () => { player.currentTime = starts[Number(li.dataset.i)]; player.play().catch(() => {}); }));
    $("#playall").onclick = () => { player.currentTime = 0; player.play().catch(() => {}); };
    return;
  }
  const clipUrl = (i) => img(cut.branch, cut.edl[i].file);
  let i = 0;
  const play = async (n) => {
    i = n;
    document.querySelectorAll("#edl li").forEach((li) => li.classList.toggle("now", Number(li.dataset.i) === i));
    const url = await clipUrl(i);
    if (url) { player.src = url; player.play().catch(() => {}); }
  };
  player.onended = () => { if (i + 1 < cut.edl.length) play(i + 1); };
  document.querySelectorAll("#edl li").forEach((li) => (li.onclick = () => play(Number(li.dataset.i))));
  $("#playall").onclick = () => play(0);
  const first = await clipUrl(0);
  if (first && !player.src) player.src = first;
}

function cellHtml(cell) {
  const t = currentTake(cell);
  const printedHere = t && t.take === cell.printed;
  const cont = !t ? "" : !t.continuity ? `<span class="pill">shooting…</span>`
    : t.stale ? `<span class="pill" title="This take was judged against characters that have since changed">before bible change</span>`
    : t.continuity.ok ? `<span class="pill ok">continuity ok</span>` : `<span class="pill bad">continuity break</span>`;
  const styleOpts = state.skills.available.filter((k) => k.role === "cinematographer").map((k) => `<option value="${esc(k.name)}" ${k.name === state.skills.chosen.cinematographer ? "selected" : ""}>${esc(k.style)}</option>`).join("");
  return `
  <article class="cell ${busyCells.has(cell.id) || cellActivity(cell.id) ? "busy" : ""}" data-cell="${cell.id}">
    <div class="frame">
      ${t ? `<img data-ref="${esc(t.branch)}" data-path="cells/${cell.id}/frame.webp" data-live="${t.done ? "" : "1"}" alt="">` : `<div class="empty">no takes yet</div>`}
      <span class="tag">${cell.id} · ${esc(cell.shot)} · ${esc(cell.camera)}</span>
      ${t ? `<span class="tag right">take ${t.take}${printedHere ? " · printed" : ""}</span>` : ""}
    </div>
    <div class="body">
      <div class="beat">${esc(cell.beat)}</div>
      <div class="meta">
        ${cell.printed ? `<span class="pill printed">printed: take ${cell.printed}</span>` : `<span class="pill">not printed</span>`}
        ${cont}
        ${t?.adherence != null ? `<span class="pill">adherence ${t.adherence.toFixed(2)}</span>` : ""}
        ${t?.skill ? `<span class="pill">${esc(t.skill)}</span>` : ""}
        ${t?.edit ? `<span class="pill printed" title="${esc(t.edit.instruction)}">edit of ${esc(t.edit.from === "main" ? "the printed frame" : t.edit.from.replace(/^cell\/\d+\//, ""))}</span>` : ""}
        ${cell.characters.length ? `<span class="pill">${esc(cell.characters.join(", "))}</span>` : ""}
        ${cell.location ? `<span class="pill" title="${esc(cell.blocking || "")}">${esc(cell.location)}${cell.positions && Object.keys(cell.positions).length ? ` · ${esc(Object.entries(cell.positions).map(([n, p]) => `${n} ${p}`).join(", "))}` : ""}</span>` : ""}
      </div>
      <div class="takes">${cell.takes.map((k) => `
        <button class="take ${t && k.take === t.take ? "sel" : ""}" data-take="${k.take}" title="${esc(k.branch)}">
          ${k.done ? `<img data-ref="${esc(k.branch)}" data-path="cells/${cell.id}/frame.webp" alt="">` : `<div class="ph"></div>`}
          <span class="n">${k.take}${k.take === cell.printed ? " ★" : ""}</span>
          <span class="dot ${!k.done ? "wip" : k.stale ? "stale" : k.continuity?.ok ? "ok" : "bad"}"></span>
        </button>`).join("")}</div>
      ${t?.continuity && !t.continuity.ok && !t.stale ? `<div class="issues">${t.continuity.issues.map(esc).join("<br>")}</div>` : ""}
      ${t?.edit ? `<div class="prompt">Edit: ${esc(t.edit.instruction)}</div>` : ""}
      ${t?.prompt ? `<div class="prompt">${esc(t.prompt)}</div>` : ""}
      <div class="row">
        ${t && t.done && !printedHere ? `<button class="primary" data-act="print">Print take ${t.take}</button>` : ""}
        <select data-style>${styleOpts}</select>
        <button data-act="retake">Retake</button>
      </div>
      ${cell.notes ? `<div class="notes">${esc(cell.notes.replace(/^# Notes.*\n+/, "").replace(/\*\*/g, ""))}</div>` : ""}
      <div class="row"><textarea rows="2" data-note placeholder="A note re-shoots it: “move the camera lower”. An edit fixes one detail of the frame shown: “one pair of glasses, pushed up”">${esc(drafts[cell.id] || "")}</textarea></div>
      <div class="row"><button data-act="note">Send note</button>${t?.done ? `<button data-act="editframe" title="An image model edits take ${t.take}'s frame as you say and changes nothing else: a new take, about $0.11">Edit take ${t.take}'s frame</button>` : ""}<span class="status">${esc(cellActivity(cell.id) || cellStatus[cell.id] || "")}</span></div>
    </div>
  </article>`;
}

async function hydrate(cutKept = false) {
  if (!cutKept) hydrateCut();
  document.querySelectorAll("[data-play]").forEach((b) => (b.onclick = async () => {
    const url = await img("main", b.dataset.play, false);
    const a = $("#soundplayer");
    if (url && a) { a.src = url; a.play().catch(() => {}); }
  }));
  const cutButton = document.querySelector("[data-board-act=cut]");
  if (cutButton) cutButton.onclick = async () => {
    cutButton.disabled = true;
    try { await run("Queueing video…", [], () => api(`/boards/${state.repo}/cut`, { method: "POST", body: "{}" })); }
    catch (err) { console.error(err); cutButton.disabled = false; }
  };
  document.querySelectorAll("img[data-path]").forEach(async (el) => {
    const url = await img(el.dataset.ref, el.dataset.path, !el.dataset.live);
    if (url) el.src = url;
  });
  document.querySelectorAll("select[data-crew]").forEach((el) => (el.onchange = async () => {
    await run(`Switching the ${SLOT_NAMES[el.dataset.crew].short} to ${el.value}…`, [], () => api(`/boards/${state.repo}/crew`, { method: "POST", body: JSON.stringify({ crew: { [el.dataset.crew]: el.value } }) }));
  }));
  document.querySelectorAll("select[data-role]").forEach((el) => (el.onchange = async () => {
    await run(`Switching ${el.dataset.role}…`, [], () => api(`/boards/${state.repo}/roles/${el.dataset.role}`, { method: "POST", body: JSON.stringify({ skill: el.value }) }));
  }));
  document.querySelectorAll(".cell").forEach((card) => {
    const id = card.dataset.cell;
    const cell = state.cells.find((c) => c.id === id);
    card.querySelectorAll(".take").forEach((b) => (b.onclick = () => { selected[id] = Number(b.dataset.take); render(); }));
    card.querySelectorAll("[data-act]").forEach((b) => (b.onclick = async () => {
      b.disabled = true;
      const act = b.dataset.act;
      try {
        if (act === "print") {
          const t = currentTake(cell);
          await run(`Printing take ${t.take}…`, [id], () => api(`/boards/${state.repo}/cells/${id}/print`, { method: "POST", body: JSON.stringify({ take: t.take }) }));
          cellStatus[id] = `Printed take ${t.take} (merged into main)`;
        } else if (act === "retake") {
          const skill = card.querySelector("[data-style]").value;
          const out = await run("Queueing a take…", [id], () => api(`/boards/${state.repo}/cells/${id}/takes`, { method: "POST", body: JSON.stringify({ skill }) }));
          selected[id] = out.jobs[0].take;
          cellStatus[id] = `Take ${selected[id]} queued`;
        } else if (act === "editframe") {
          const instruction = card.querySelector("[data-note]").value.trim();
          if (!instruction) return;
          const t = currentTake(cell);
          drafts[id] = "";
          card.querySelector("[data-note]").value = "";
          const out = await run("Queueing an edit…", [id], () => api(`/boards/${state.repo}/cells/${id}/edits`, { method: "POST", body: JSON.stringify({ instruction, ...(t.take === cell.printed ? {} : { take: t.take }) }) }));
          selected[id] = out.jobs[0].take;
          cellStatus[id] = `Edit of take ${t.take} queued as take ${selected[id]}`;
        } else if (act === "note") {
          const note = card.querySelector("[data-note]").value.trim();
          if (!note) return;
          drafts[id] = "";
          card.querySelector("[data-note]").value = "";
          const out = await run("Routing note…", [id], () => api(`/boards/${state.repo}/cells/${id}/notes`, { method: "POST", body: JSON.stringify({ note }) }));
          const p = out.route.probabilities[out.route.action] ?? 0;
          const queued = out.jobs.map((j) => (j.kind === "take" ? `take ${j.take}` : `${j.kind} edit`)).join(", ");
          cellStatus[id] = `Routed → ${out.route.action} (p=${p.toFixed(2)})${queued ? ` · queued ${queued}` : ""}`;
          const mine = out.jobs.find((j) => j.kind === "take" && j.cell === id);
          if (mine) selected[id] = mine.take;
        }
      } catch (err) { console.error(err); }
      finally { render(); }
    }));
  });
}

loadBoards().catch((err) => ($("#main").innerHTML = `<p class="muted">${esc(err.message)}</p>`));
</script>
